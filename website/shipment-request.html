<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipment Request — Mapleby Inc.</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Oswald:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-[#0A0F14] text-white overflow-x-hidden selection:bg-[#D43F3A] selection:text-white font-['Archivo']">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 px-6 py-4 flex justify-between items-center transition-all duration-300" id="navbar">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#D43F3A] clip-corner"></div>
            <a href="index.html" class="font-['Oswald'] text-2xl font-bold tracking-tight text-white">MAPLEBY</a>
        </div>
        <div class="hidden md:flex gap-8 items-center font-mono text-xs uppercase tracking-widest text-gray-300">
            <a href="index.html" class="hover:text-[#D43F3A] transition-colors">Home</a>
            <a href="contact.html" class="hover:text-[#D43F3A] transition-colors">Contact</a>
        </div>
        <button class="hidden md:block btn-primary text-xs">Get Quote</button>
    </nav>

    <!-- Content -->
    <section class="min-h-screen flex flex-col items-center justify-center p-6 md:p-20 pt-40">
        <div class="max-w-2xl w-full">
            <header class="text-center mb-12">
                <span class="text-[#D43F3A] font-mono text-sm uppercase tracking-widest mb-4 block">/// Formal
                    Request</span>
                <h1 class="font-['Oswald'] text-4xl md:text-6xl font-bold uppercase leading-none mb-6">Initiate <span
                        class="text-outline-w">Shipment</span></h1>
                <p class="text-gray-400">Please provide details about the cargo. Our logistics team will review and
                    provide a pro-forma invoice within 24 hours.</p>
            </header>

            <form class="space-y-6 bg-[#0F1419] p-8 md:p-12 border border-white/10">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="font-mono text-xs uppercase text-white/50">First Name</label>
                        <input type="text" class="input-field" placeholder="NAME">
                    </div>
                    <div class="space-y-2">
                        <label class="font-mono text-xs uppercase text-white/50">Last Name</label>
                        <input type="text" class="input-field" placeholder="SURNAME">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="font-mono text-xs uppercase text-white/50">Email Address</label>
                    <input type="email" class="input-field" placeholder="EMAIL">
                </div>

                <div class="space-y-2">
                    <label class="font-mono text-xs uppercase text-white/50">Services Required</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label
                            class="flex items-center space-x-3 p-4 bg-white/5 cursor-pointer border border-white/10 hover:border-[#D43F3A] transition-colors">
                            <input type="checkbox" class="form-checkbox text-[#D43F3A] border-white/20 bg-transparent">
                            <span class="uppercase text-sm font-bold">Vehicle Purchase</span>
                        </label>
                        <label
                            class="flex items-center space-x-3 p-4 bg-white/5 cursor-pointer border border-white/10 hover:border-[#D43F3A] transition-colors">
                            <input type="checkbox" class="form-checkbox text-[#D43F3A] border-white/20 bg-transparent">
                            <span class="uppercase text-sm font-bold">Ocean Shipping</span>
                        </label>
                        <label
                            class="flex items-center space-x-3 p-4 bg-white/5 cursor-pointer border border-white/10 hover:border-[#D43F3A] transition-colors">
                            <input type="checkbox" class="form-checkbox text-[#D43F3A] border-white/20 bg-transparent">
                            <span class="uppercase text-sm font-bold">Clearing</span>
                        </label>
                        <label
                            class="flex items-center space-x-3 p-4 bg-white/5 cursor-pointer border border-white/10 hover:border-[#D43F3A] transition-colors">
                            <input type="checkbox" class="form-checkbox text-[#D43F3A] border-white/20 bg-transparent">
                            <span class="uppercase text-sm font-bold">Inland Transport</span>
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="font-mono text-xs uppercase text-white/50">Cargo Details (Make, Model, Year,
                        VIN)</label>
                    <textarea class="input-field h-32" placeholder="ENTER DETAILS"></textarea>
                </div>

                <button type="button" class="w-full btn-primary py-4">
                    Submit Request
                </button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
